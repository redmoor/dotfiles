$mainMod = SUPER
$terminal = kitty

source = $HOME/.config/hypr/platform/current.conf
source = $HOME/.config/hypremoji/hypremoji.conf

env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,theme_WowCursor
env = HYPRCURSOR_SIZE,32
env = PATH,$HOME/.local/bin:$PATH

exec-once = hyprpaper
exec-once = mako
exec-once = hyprlauncher -d
exec-once = sleep 1 & waybar

exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 2 silent] firefox
exec-once = [workspace 5 silent] Telegram

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 2

    border_size = 1

    col.active_border = rgba(f7b28eee) rgba(d4a8e2ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true

    allow_tearing = false
    layout = dwindle
}

dwindle {
  preserve_split = true
  pseudotile = true
}

misc {
  middle_click_paste = false
  disable_splash_rendering = true
  disable_hyprland_logo = true
}

decoration {
    rounding = 6
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)
    workspace_wraparound = true

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = overshot,       0.05, 0.9, 0.1, 1.05

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     2.5,  overshot
    animation = zoomFactor,    1,     7,     quick
}

input {
    kb_layout =us,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

# Kitty stylish opacity
windowrule {
    name = kitty-opacity
    match:class = ^kitty$
    # opacity: active and inactive
    opacity = 0.97 0.85
}

# Emacs stylish opacity
windowrule {
    name = emacs-opacity
    match:class = ^Emacs$
    # opacity: active and inactive
    opacity = 0.97 0.85
}

# Share screen window
windowrule {
    name = hyprland-share-picker
    match:initial_class = ^hyprland-share-picker$
    float = on
    size = (monitor_w*0.6) (monitor_h*0.3)
    center = on
}

# Iwgtk
windowrule {
    name = iwgtk-style
    match:initial_class = ^org.twosheds.iwgtk$
    float = on
    animation = slide top
    move = (monitor_w-450) 40
    pin = on
}

# Pulsemixer
windowrule {
    name = wiremix-style
    match:initial_class = ^wiremix$
    float = on
    size = (monitor_w*0.6) (monitor_h*0.6)
    center = on
    pin = on
}

# Impala
windowrule {
    name = impala
    match:initial_class = ^impala$
    float = on
    size = (monitor_w*0.6) (monitor_h*0.6)
    center = on
    pin = on
}


bind = $mainMod, T, exec, $terminal
bind = $mainMod, SPACE, exec, hyprlauncher
bind = $mainMod, B, exec, firefox
bind = $mainMod, Q, killactive
bind = $mainMod, M, exec, kitty --class wiremix -e wiremix
bind = $mainMod SHIFT, S, exec, flameshot gui
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = $mainMod, N, exec, kitty --class impala -e impala

bind = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.0

bind = $mainMod, s, layoutmsg, togglesplit
bind = $mainMod, w, layoutmsg, swapsplit
bind = $mainMod, f, togglefloating
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r 
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

binde = $mainMod SHIFT, l, resizeactive, 25 0
binde = $mainMod SHIFT, h, resizeactive, -25 0
binde = $mainMod SHIFT, k, resizeactive, 0 -25
binde = $mainMod SHIFT, j, resizeactive, 0 25

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
